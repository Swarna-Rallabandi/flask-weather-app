name: Build, Test, and Deploy Flask Docker App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: flask-weather-app

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Run Docker container for validation
        run: |
          docker run -d -p 5000:5000 --name flask-weather-test $IMAGE_NAME:latest
          sleep 5
          curl --fail http://localhost:5000

      - name: Stop and remove test container
        if: always()
        run: |
          docker stop flask-weather-test || true
          docker rm flask-weather-test || true

      - name: Deploy application
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Deployment step goes here"
          echo "Example: push image to Docker Hub, AWS ECR, Azure Container Registry, or deploy to a server"